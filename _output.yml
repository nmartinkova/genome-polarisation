bookdown::gitbook:
  css: style.css
  config:
    toc:
      collapse: section
      before: |
         <li class="book-logo">
          <a href="./">
            <img src="figs/logo-diemr.png" alt="Genome polarisation with diemr" style="max-width: 120px;">
          </a>
         </li>
      after:  |
        <li><a href="https://github.com/nmartinkova/genome-polarisation" target="_blank">
          Contribute on GitHub
        </a></li>
    sharing: null
    download: ["pdf", "epub"]
    navbar:
      right:
        - text: "Cite"
          href: "#how-to-cite"
bookdown::pdf_book:
  citation_package: natbib
  keep_tex: true
bookdown::epub_book: default