bookdown::gitbook:
  css: style.css
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">Genome polarisation with diemr</a></li>
      after:  |
        <li><a href="https://github.com/nmartinkova/genome-polarisation" target="_blank">
          Contribute on GitHub
        </a></li>
    sharing: null
    download: ["pdf", "epub"]
    navbar:
      right:
        - text: "Cite"
          href: "#how-to-cite"
bookdown::pdf_book:
  citation_package: natbib
  keep_tex: true
bookdown::epub_book: default